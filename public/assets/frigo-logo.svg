<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- Fridge Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Fridge Body -->
    <rect x="0" y="0" width="50" height="60" rx="14" fill="#22C55E" />
    <!-- Inner Door Inset -->
    <rect x="4" y="4" width="42" height="52" rx="10" fill="#DDF7E3" />
    <!-- Upper Freezer Door -->
    <rect x="7" y="7" width="36" height="20" rx="6" fill="#FFFFFF" />
    <rect x="11" y="15" width="8" height="3" rx="1.5" fill="#0F3D2E" />
    <!-- Lower Fridge Door -->
    <rect x="7" y="31" width="36" height="22" rx="6" fill="#FFFFFF" />
    <rect x="11" y="37" width="8" height="3" rx="1.5" fill="#0F3D2E" />
    <!-- Leaf in Lower Door -->
    <path d="M34 40 C34 35 27 34 26 44 C32 45 35 43 34 40 Z" fill="#22C55E" />
    <path d="M28 42 Q32 38 33 37" stroke="#0F3D2E" stroke-width="0.8" stroke-linecap="round" />
  </g>
  <!-- Brand Text "Frigo" -->
  <text x="75" y="48" font-family="system-ui, -apple-system, 'Poppins', 'Inter', sans-serif" font-weight="800" font-size="44" fill="#0F3D2E" letter-spacing="-1px">
    Frigo
  </text>
  <!-- Leaf accent on top of 'o' -->
  <path d="M202 18 C204 10 216 10 215 22 C206 23 200 20 202 18 Z" fill="#22C55E" />
</svg>
